<!DOCTYPE html>
<html lang="zh-TW" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGoMacau 澳門探索地圖</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP for Smooth Camera & UI Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            green: '#00A86B',
                            amber: '#FF9F1C',
                            dark: '#0C1B17',
                            card: 'rgba(12, 27, 23, 0.75)',
                            gold: '#FFD700'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0c1b17;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(15, 32, 28, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(0, 168, 107, 0.4);
            border-color: #00A86B;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 168, 107, 0.3);
        }

        /* Pulse Glowing Animation for HTML Markers */
        @keyframes pinPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 168, 107, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 168, 107, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 168, 107, 0); }
        }

        .pulse-glow {
            animation: pinPulse 2s infinite;
        }

        /* Canvas Overlay Fixes */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body class="h-full w-full text-white">

    <!-- WebGL Canvas Container -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" class="flex flex-col justify-between p-4 md:p-6">
        
        <!-- TOP HUD -->
        <header class="flex justify-between items-center w-full pointer-events-auto">
            <!-- Brand Logo -->
            <div class="flex items-center gap-3 glass-panel px-4 py-2.5 rounded-2xl border border-emerald-500/30">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-700 flex items-center justify-center font-black text-xl shadow-lg shadow-emerald-900/50">
                    澳門奶茶
                </div>
                <div>
                    <h1 class="font-extrabold text-base md:text-lg tracking-wider text-white leading-tight">
                        澳門奶茶 <span class="text-amber-400 font-black">GoGoMacau</span>
                    </h1>
                    <p class="text-[10px] md:text-xs text-emerald-300/80 font-medium tracking-widest">3D 澳門探索行銷體驗</p>
                </div>
            </div>

            <!-- Right Controls: Score, Audio & Reset -->
            <div class="flex items-center gap-2 md:gap-3">
                <!-- Score Counter -->
                <div class="glass-panel px-3.5 py-2 rounded-xl flex items-center gap-2 text-sm font-bold border border-amber-500/30">
                    <i class="fa-solid fa-bolt text-amber-400 animate-bounce"></i>
                    <span class="text-xs text-gray-300">探索積分:</span>
                    <span id="score-text" class="text-amber-400 text-base font-black">1,250</span>
                </div>

                <!-- Sound Toggle -->
                <button id="btn-sound" onclick="toggleAudio()" class="glass-button w-10 h-10 rounded-xl flex items-center justify-center text-emerald-400 text-sm">
                    <i id="sound-icon" class="fa-solid fa-volume-xmark"></i>
                </button>

                <!-- Reset Camera Button -->
                <button onclick="resetCameraView()" class="glass-button px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs md:text-sm font-semibold text-white">
                    <i class="fa-solid fa-globe text-emerald-400"></i>
                    <span class="hidden md:inline">全景導覽</span>
                </button>
                <button onclick="openCouponWallet()" class="glass-button px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs md:text-sm font-semibold text-amber-200" aria-label="我的卡包">
                    <i class="fa-solid fa-ticket text-amber-400"></i>
                    <span class="hidden md:inline">我的卡包</span>
                    <span id="coupon-wallet-badge" class="bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-black">0</span>
                </button>
            </div>
        </header>

        <a id="btn-enter-monopoly" href="3d_dice_v2.html?from=explore" class="hidden fixed top-24 right-4 md:right-6 z-20 pointer-events-auto glass-button px-4 py-3 rounded-xl flex items-center gap-2 text-sm font-bold text-amber-200 border border-amber-400/50 shadow-lg" aria-label="進入 3D 美食大富翁">
            <i class="fa-solid fa-dice text-amber-400"></i>
            <span>進入 3D 美食大富翁</span>
        </a>

        <!-- CENTER FLOATING INSTRUCTION (Fades out on click) -->
        <div id="instruction-hint" class="self-center glass-panel px-6 py-3 rounded-full text-xs md:text-sm text-emerald-200 flex items-center gap-3 border border-emerald-500/30 shadow-2xl transition-opacity duration-500">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span>點擊地圖上的 <b class="text-amber-300">地標 Pin 針</b> 或下方選單，展開 3D 飛行動畫</span>
        </div>

        <!-- BOTTOM QUICK JUMP BAR -->
        <footer class="w-full flex justify-center pointer-events-auto">
            <div class="glass-panel p-2 md:p-2.5 rounded-2xl flex items-center gap-1.5 md:gap-3 max-w-full overflow-x-auto border border-white/10">
                <button onclick="flyToLandmark('taipei101')" class="nav-btn glass-button px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs md:text-sm font-medium whitespace-nowrap text-gray-200 hover:text-white">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    澳門旅遊塔
                </button>
                <button onclick="flyToLandmark('sunmoonlake')" class="nav-btn glass-button px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs md:text-sm font-medium whitespace-nowrap text-gray-200 hover:text-white">
                    <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                    大三巴牌坊
                </button>
                <button onclick="flyToLandmark('alishan')" class="nav-btn glass-button px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs md:text-sm font-medium whitespace-nowrap text-gray-200 hover:text-white">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    議事亭前地
                </button>
                <button onclick="flyToLandmark('kenting')" class="nav-btn glass-button px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs md:text-sm font-medium whitespace-nowrap text-gray-200 hover:text-white">
                    <span class="w-2 h-2 rounded-full bg-rose-400"></span>
                    路環黑沙海灘
                </button>
            </div>
        </footer>

        <!-- LANDMARK DETAIL GLASS MODAL (Hidden by default) -->
        <div id="landmark-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-500">
            <div id="modal-card" class="glass-panel w-full max-w-md p-6 md:p-8 rounded-3xl border border-emerald-500/40 transform scale-95 transition-transform duration-500 relative overflow-hidden">
                <!-- Background Accent Glow -->
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
                
                <!-- Modal Close Icon -->
                <button onclick="closeModalAndReset()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/20 transition-all">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <!-- Modal Header Icon & Tag -->
                <div class="flex items-center gap-3 mb-4">
                    <div id="modal-icon-bg" class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-2xl text-emerald-400">
                        <i id="modal-icon" class="fa-solid fa-location-dot"></i>
                    </div>
                    <div>

                        <span id="modal-tag" class="text-[11px] font-bold tracking-widest text-emerald-400 uppercase">黑松熱門打卡景點</span>
                        <h2 id="modal-title" class="text-2xl font-black text-white tracking-wide">景點名稱</h2>
                    </div>
                </div>

                <!-- Description -->
                <p id="modal-desc" class="text-sm text-gray-300 leading-relaxed mb-6 font-normal">
                    地標描述內容加載中...
                </p>

                <!-- Reward Banner Box -->
                <div class="bg-gradient-to-r from-emerald-950/80 to-teal-900/60 p-4 rounded-2xl border border-emerald-500/30 mb-6 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-amber-400/20 flex items-center justify-center text-amber-400 font-bold text-xl">
                            <i class="fa-solid fa-ticket"></i>
                        </div>
                        <div>
                            <div class="text-xs text-amber-300 font-bold">限定探索獎勵</div>
                            <div id="modal-reward-text" class="text-xs text-gray-200">黑松沙士飲品折抵 ¥10</div>
                        </div>
                    </div>
                    <span class="text-[10px] bg-amber-400 text-black font-extrabold px-2 py-1 rounded-md uppercase">Hot</span>
                </div>

                <!-- Modal Action Buttons -->
                <div class="flex items-center gap-3">
                    <button id="btn-claim-coupon" onclick="claimCoupon(this)" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-900/40 flex items-center justify-center gap-2 transition-all transform active:scale-95">
                        <i class="fa-solid fa-gift"></i>
                        <span>領取專屬卡券</span>
                    </button>
                    <button onclick="closeModalAndReset()" class="glass-button font-bold text-sm text-gray-300 py-3.5 px-4 rounded-xl">
                        返歸地圖
                    </button>
                </div>
            </div>
        </div>

        <div id="coupon-wallet-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-500">
            <div class="glass-panel w-full max-w-xl p-6 md:p-8 rounded-3xl border border-emerald-500/40 relative flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center pb-4 border-b border-emerald-500/20 mb-4">
                    <div>
                        <h2 class="text-xl font-black text-white">我的專屬卡包</h2>
                        <p class="text-xs text-gray-400">已領取的探索優惠券</p>
                    </div>
                    <button onclick="closeCouponWallet()" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-gray-300 hover:text-white" aria-label="關閉卡包">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="coupon-wallet-items" class="space-y-3 overflow-y-auto flex-1"></div>
            </div>
        </div>

        <!-- INITIAL LOADING OVERLAY -->
        <div id="loading-overlay" class="fixed inset-0 z-50 bg-[#0c1b17] flex flex-col items-center justify-center pointer-events-auto transition-opacity duration-700">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-3xl font-black text-white shadow-2xl mb-6 animate-bounce">
                黑
            </div>
            <h2 class="text-xl font-extrabold text-white tracking-wider mb-2">3D 澳門探索場景構築中...</h2>
            <p class="text-xs text-emerald-400/80 font-medium mb-6">正在生成澳門半島、氹仔與路環地標</p>
            
            <!-- Progress Bar -->
            <div class="w-64 h-2 bg-gray-800 rounded-full overflow-hidden p-0.5 border border-emerald-500/20">
                <div id="loading-bar" class="h-full bg-gradient-to-r from-emerald-400 to-amber-400 rounded-full w-0 transition-all duration-300"></div>
            </div>
        </div>

    </div>

    <script>
        let scene, camera, renderer, controls;
        let landmarksGroup, islandGroup, oceanMesh;
        let animatedPins = [];
        let activeLandmarkKey = null;
        let isFlying = false;
        let score = 1250;
        let audioCtx = null;
        let isAudioPlaying = false;
        let claimedCoupons = [];

        function readCouponsFromUrl() {
            try {
                const payload = new URLSearchParams(window.location.search).get('coupons');
                return payload ? JSON.parse(payload) : [];
            } catch (error) {
                console.warn('Unable to read coupon data from URL:', error);
                return [];
            }
        }

        function migrateCouponToMacau(coupon) {
            const key = coupon.landmarkKey ||
                (coupon.id?.startsWith('explore_taipei101_') || coupon.code?.startsWith('GT-TAIPEI101-') || coupon.title?.includes('台北 101') ? 'taipei101' :
                coupon.id?.startsWith('explore_sunmoonlake_') || coupon.title?.includes('日月潭') ? 'sunmoonlake' :
                coupon.id?.startsWith('explore_alishan_') || coupon.title?.includes('阿里山') ? 'alishan' :
                coupon.id?.startsWith('explore_kenting_') || coupon.title?.includes('墾丁') ? 'kenting' : null);
            if (!key || !LANDMARKS_DATA[key]) return coupon;

            const landmark = LANDMARKS_DATA[key];
            return {
                ...coupon,
                landmarkKey: key,
                title: landmark.name,
                desc: landmark.desc,
                reward: landmark.reward
            };
        }

        function loadClaimedCoupons() {
            try {
                const stored = JSON.parse(localStorage.getItem('gogotaiwan-coupons') || '[]');
                claimedCoupons = [...stored, ...readCouponsFromUrl()].map(migrateCouponToMacau);
                claimedCoupons = claimedCoupons.filter((coupon, index, coupons) =>
                    coupon && coupon.id && coupons.findIndex(item => item.id === coupon.id) === index
                );
                localStorage.setItem('gogotaiwan-coupons', JSON.stringify(claimedCoupons));
            } catch (error) {
                claimedCoupons = readCouponsFromUrl();
                console.warn('Unable to load saved coupons:', error);
            }
            const usedCouponIds = readUsedCouponIds();
            claimedCoupons.forEach(coupon => {
                coupon.used = usedCouponIds.includes(coupon.id);
            });
            updateCouponWallet();
            syncMonopolyLink();
        }

        function syncMonopolyLink() {
            const payload = encodeURIComponent(JSON.stringify(claimedCoupons));
            document.getElementById('btn-enter-monopoly').href = `3d_dice_v2.html?from=explore&coupons=${payload}`;
        }

        function saveClaimedCoupons() {
            try {
                localStorage.setItem('gogotaiwan-coupons', JSON.stringify(claimedCoupons));
            } catch (error) {
                console.warn('Unable to save coupons:', error);
            }
            updateCouponWallet();
            syncMonopolyLink();
        }

        function updateCouponWallet() {
            const badge = document.getElementById('coupon-wallet-badge');
            const container = document.getElementById('coupon-wallet-items');
            if (!badge || !container) return;

            badge.innerText = claimedCoupons.length;
            container.innerHTML = claimedCoupons.length
                ? claimedCoupons.map(coupon => `
                    <div class="glass-panel p-4 rounded-xl border border-emerald-500/30">
                        <h3 class="text-sm font-bold text-amber-200">${coupon.title}</h3>
                        <p class="text-xs text-gray-300 mt-1">${coupon.desc}</p>
                        <div class="flex justify-between gap-3 mt-3 text-[11px] text-gray-400">
                            <span>核銷碼：<b class="text-emerald-300">${coupon.code}</b></span>
                            <span>有效期至：${coupon.exp}</span>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <span class="text-[11px] text-amber-300">${coupon.discountLabel || '專屬優惠'}</span>
                            ${coupon.used ? '<span class="text-[11px] text-gray-500">已使用</span>' : `<button onclick="redeemGameCoupon('${coupon.id}')" class="bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">立即核銷</button>`}
                        </div>
                    </div>
                `).join('')
                : '<p class="text-center text-sm text-gray-400 py-8">尚未領取優惠券</p>';
        }

            function readUsedCouponIds() {
                try {
                    return JSON.parse(localStorage.getItem('gogotaiwan-used-coupons') || '[]');
                } catch (error) {
                    return [];
                }
            }

        function openCouponWallet() {
            updateCouponWallet();
            document.getElementById('coupon-wallet-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('coupon-wallet-modal').classList.add('pointer-events-auto');
        }

        function closeCouponWallet() {
            const modal = document.getElementById('coupon-wallet-modal');
            modal.classList.remove('pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function redeemGameCoupon(couponId) {
            const coupon = claimedCoupons.find(item => item.id === couponId);
            if (!coupon || coupon.used) return;
            window.location.href = `shopping.html?coupon=${encodeURIComponent(JSON.stringify(coupon))}`;
        }

        function getClaimedCouponForLandmark(landmarkKey) {
            const landmark = LANDMARKS_DATA[landmarkKey];
            if (!landmark) return null;

            return claimedCoupons.find(coupon =>
                coupon.landmarkKey === landmarkKey ||
                coupon.id?.startsWith(`explore_${landmarkKey}_`) ||
                (coupon.title === landmark.name && coupon.code?.startsWith(`GT-${landmarkKey.toUpperCase()}-`))
            ) || null;
        }

        function updateLandmarkClaimButton() {
            const button = document.getElementById('btn-claim-coupon');
            if (!button) return;

            const alreadyClaimed = !!getClaimedCouponForLandmark(activeLandmarkKey);
            button.disabled = alreadyClaimed;
            button.innerHTML = alreadyClaimed
                ? '<i class="fa-solid fa-check"></i><span>已領取</span>'
                : '<i class="fa-solid fa-gift"></i><span>領取專屬卡券</span>';
            button.classList.toggle('bg-amber-500', alreadyClaimed);
            button.classList.toggle('opacity-60', alreadyClaimed);
            button.classList.toggle('cursor-not-allowed', alreadyClaimed);
            if (!alreadyClaimed) {
                button.classList.add('from-emerald-500', 'to-teal-600');
                button.classList.remove('bg-amber-500', 'opacity-60', 'cursor-not-allowed');
            } else {
                button.classList.remove('from-emerald-500', 'to-teal-600');
            }
        }

        // Default Camera Coordinates
        const OVERVIEW_CAMERA_POS = { x: 0, y: 32, z: 40 };
        const OVERVIEW_TARGET_POS = { x: 0, y: 0, z: 0 };

        // Landmark Data Dictionary (Position, Camera Offsets, Metadata)
        const LANDMARKS_DATA = {
            taipei101: {
                name: '澳門旅遊塔觀景台',
                tag: '南灣城市天際',
                icon: 'fa-building-columns',
                pos: { x: 1.8, y: 2.2, z: -8.5 },
                camOffset: { x: 3.5, y: 3.0, z: 4.5 },
                desc: '登上澳門旅遊塔俯瞰南灣與珠江口天際線，探索世界級高空觀景體驗；使用黑松沙士專屬優惠，為旅程添一份清涼。',
                reward: '黑松沙士飲品折抵 ¥10'
            },
            sunmoonlake: {
                name: '大三巴牌坊歷史街區',
                tag: '世界文化遺產地標',
                icon: 'fa-landmark',
                pos: { x: -0.5, y: 2.6, z: -0.5 },
                camOffset: { x: -3.0, y: 2.5, z: 4.0 },
                desc: '漫步大三巴牌坊與周邊歷史街區，細看中西文化交融的城市印記；探索澳門老城風情並領取專屬餐飲優惠。',
                reward: '大三巴歷史街區套餐 85 折'
            },
            alishan: {
                name: '議事亭前地步行區',
                tag: '南歐風情城市廣場',
                icon: 'fa-map-location-dot',
                pos: { x: -1.8, y: 3.2, z: 3.0 },
                camOffset: { x: -4.0, y: 3.0, z: 3.5 },
                desc: '從議事亭前地出發，沿著波浪紋碎石路探索歷史建築與特色小店，感受澳門獨有的葡式廣場風情。',
                reward: '議事亭前地美食套餐 85 折'
            },
            kenting: {
                name: '路環黑沙海灘',
                tag: '路環海岸休閒地標',
                icon: 'fa-umbrella-beach',
                pos: { x: 0.2, y: 1.8, z: 11.0 },

        function initEngine() {
            const container = document.getElementById('webgl-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c1b17);
            scene.fog = new THREE.FogExp2(0x0c1b17, 0.012);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(OVERVIEW_CAMERA_POS.x, OVERVIEW_CAMERA_POS.y, OVERVIEW_CAMERA_POS.z);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera going below water
            controls.minDistance = 5;
            controls.maxDistance = 80;
            controls.target.set(OVERVIEW_TARGET_POS.x, OVERVIEW_TARGET_POS.y, OVERVIEW_TARGET_POS.z);

            // 5. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
            dirLight.position.set(25, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            const d = 25;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // Secondary Rim Light
            const rimLight = new THREE.DirectionalLight(0x00a86b, 0.6);
            rimLight.position.set(-20, 15, -20);
            scene.add(rimLight);

            // Setup Raycaster for Clicking 3D Pins
            setupRaycaster();

            // Handle Resize
            window.addEventListener('resize', onWindowResize);
        }

        function createMountainRidges() {
            const mountainGeo = new THREE.ConeGeometry(1.2, 2.5, 5);
            const mountainMat = new THREE.MeshStandardMaterial({ color: 0x144e34, flatShading: true });
            const snowCapMat = new THREE.MeshStandardMaterial({ color: 0xe0f2fe, flatShading: true });

            // Spine along Central Mountain Range
            const ridgeCoords = [
                { x: 0.2, z: -6.0, h: 2.2 },
                { x: 0.0, z: -3.5, h: 3.2 },
                { x: -0.4, z: -1.0, h: 3.8 }, // Yushan / Central peak
                { x: -0.6, z: 1.5, h: 3.0 },
                { x: -0.2, z: 4.5, h: 2.4 },
                { x: 0.1, z: 7.5, h: 1.8 }
            ];

            ridgeCoords.forEach(c => {
                const m = new THREE.Mesh(mountainGeo, mountainMat);
                m.position.set(c.x, 1.2 + c.h / 2, c.z);
                m.scale.set(1.2, c.h / 1.5, 1.2);
                m.castShadow = true;
                islandGroup.add(m);

                // Add Snowcap on tall peaks
                if (c.h > 3.0) {
                    const snow = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.8, 5), snowCapMat);
                    snow.position.set(c.x, 1.2 + c.h - 0.2, c.z);
                    islandGroup.add(snow);
                }
            });
        }

        function createTreesAndForests() {
            const trunkGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.5, 4);
            const foliageGeo = new THREE.DodecahedronGeometry(0.4, 0);

            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3d2e });

            const foliageMat2 = new THREE.MeshStandardMaterial({ color: 0x22c55e, flatShading: true });

            // Scatter trees around island surface
            for (let i = 0; i < 45; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 0.25;
                tree.add(trunk);

                const foliageMat = i % 2 === 0 ? foliageMat1 : foliageMat2;
                const foliage = new THREE.Mesh(foliageGeo, foliageMat);
                foliage.position.y = 0.6;
                foliage.scale.set(1 + Math.random() * 0.4, 1 + Math.random() * 0.5, 1 + Math.random() * 0.4);
                tree.add(foliage);

                // Random distribution within island bounds
                const angle = Math.random() * Math.PI * 2;
                const rZ = (Math.random() - 0.5) * 22;
                const rX = (Math.random() - 0.5) * 3.5;

                tree.position.set(rX, 1.4, rZ);
                tree.scale.setScalar(0.7 + Math.random() * 0.5);
                tree.castShadow = true;
                islandGroup.add(tree);
            }

        function create3DPinMarker(key, pos) {
            const pinGroup = new THREE.Group();
            pinGroup.position.set(pos.x, pos.y + 2.8, pos.z);
            pinGroup.userData = { key: key };

            // Inverted Cone Pin Head
            const pinHeadGeo = new THREE.ConeGeometry(0.35, 0.7, 8);
            pinHeadGeo.rotateX(Math.PI); // Point downwards
            const pinMat = new THREE.MeshStandardMaterial({
                color: 0x00a86b,
                emissive: 0x004d31,
                roughness: 0.2,
                metalness: 0.8
            });
            const pinHead = new THREE.Mesh(pinHeadGeo, pinMat);
            pinHead.position.y = 0.35;
            pinGroup.add(pinHead);

            // Glowing Pulsing Ring Base
            const ringGeo = new THREE.RingGeometry(0.2, 0.5, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -2.0; // Flat on ground
            pinGroup.add(ring);

            landmarksGroup.add(pinGroup);
            animatedPins.push({ group: pinGroup, ring: ring, head: pinHead, initialY: pos.y + 2.8 });
        }

        function setupRaycaster() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.addEventListener('click', (event) => {
                // Ignore clicks if clicking UI elements
                if (event.target.closest('.pointer-events-auto') || isFlying) return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                // Collect raycast targets (Pin heads)
                const targets = animatedPins.map(p => p.head);
                const intersects = raycaster.intersectObjects(targets);

                if (intersects.length > 0) {
                    const hitPinGroup = intersects[0].object.parent;
                    const landmarkKey = hitPinGroup.userData.key;
                    if (landmarkKey) {
                        flyToLandmark(landmarkKey);
                    }
                }
            });
        }

        function flyToLandmark(key) {
            if (isFlying || !LANDMARKS_DATA[key]) return;

            isFlying = true;
            activeLandmarkKey = key;
            const data = LANDMARKS_DATA[key];

            // Play Sound Effect
            playSynthSFX(587.33, 'sine', 0.2); // D5 chime

            // Target Camera Position & Orbit Target
            const targetFocus = new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z);
            const targetCamPos = new THREE.Vector3(
                data.pos.x + data.camOffset.x,
                data.pos.y + data.camOffset.y,
                data.pos.z + data.camOffset.z
            );

            // Hide Instruction Hint
            document.getElementById('instruction-hint').classList.add('opacity-0');

            // GSAP Animate OrbitControls Target & Camera Position Simultaneously
            gsap.timeline({
                onUpdate: () => controls.update(),
                onComplete: () => {
                    isFlying = false;
                    openLandmarkModal(data);
                }
            })
            .to(controls.target, {
                x: targetFocus.x,
                y: targetFocus.y,
                z: targetFocus.z,
                duration: 1.8,
                ease: "power2.inOut"
            }, 0)
            .to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 2.0,
                ease: "power2.inOut"
            }, 0);
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function toggleAudio() {
            initAudio();
            isAudioPlaying = !isAudioPlaying;
            const icon = document.getElementById('sound-icon');
            const btn = document.getElementById('btn-sound');

            if (isAudioPlaying) {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.add('border-emerald-400', 'text-emerald-300');
                playSynthSFX(523.25, 'sine', 0.2); // C5
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.classList.remove('border-emerald-400', 'text-emerald-300');
            }
        }

        function playSynthSFX(freq, type = 'sine', duration = 0.2) {
            if (!isAudioPlaying || !audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.warn('Audio play error:', e);
            }
        }

        function updateLoadingBar(percent) {
            const bar = document.getElementById('loading-bar');
            if (bar) bar.style.width = `${percent}%`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            const t = time * 0.001; // Seconds

            // 1. OrbitControls Update
            controls.update();

            // 2. Animate Ocean Mesh Waves
            if (oceanMesh) {
                oceanMesh.position.y = -0.5 + Math.sin(t * 1.5) * 0.08;
            }

            // 3. Floating Animation for 3D Pins
            animatedPins.forEach((pin, index) => {
                pin.group.position.y = pin.initialY + Math.sin(t * 2.5 + index) * 0.2;
                pin.head.rotation.y = t * 1.2;
                pin.ring.scale.setScalar(1 + Math.sin(t * 3 + index) * 0.2);
            });

            // 4. Render Scene
            renderer.render(scene, camera);
        }

        window.onload = function () {
            initEngine();
            buildWorldAssets();
            animate(0);
            loadClaimedCoupons();

            try {
                if (claimedCoupons.length > 0 || sessionStorage.getItem('gogotaiwan-coupon-claimed') === 'true') {
                    document.getElementById('btn-enter-monopoly').classList.remove('hidden');
                }
            } catch (error) {
                console.warn('Unable to restore coupon claim state:', error);
            }
        };
    </script>
</body>
</html>
